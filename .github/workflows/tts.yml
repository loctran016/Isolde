name: Note audio (VieNeu TTS)

on:
  push:
    branches: [main]
    paths:
      - "content" # a submodule update shows up as a change to this one path
      - "scripts/tts-text.mjs"
      - "scripts/extract-tts.mjs"
      - "scripts/generate_tts.py"
      - ".github/workflows/tts.yml"
  repository_dispatch:
    types: [content-updated] # sent by the y repo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-audio
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # content/ is the "y" repo

      # Use the newest notes from y, not just the commit this repo currently points to
      - name: Update content to the latest y
        run: git submodule update --init --remote content

      # Keep the site and the audio in step: point this repo at that version of the notes.
      # Delete this step if you already update the pointer another way.
      - name: Point Isolde at the new notes
        shell: bash
        run: |
          if ! git diff --quiet -- content; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "chore: update notes"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # Audio published by earlier runs. Skipped on the very first run, when the branch doesn't exist yet.
      - name: Does the audio branch exist?
        id: store
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.store.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: audio-store

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # use the version shown in Vercel: Project Settings > General > Node.js Version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Prerenders every note, built the same way Vercel builds it
      - run: bun run build
        env:
          NITRO_PRESET: vercel
          DEBUG: "true" # temporary: makes the log show the real error behind "[500] Server Error"
          NUXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NUXT_PUBLIC_SUPABASE_KEY: placeholder-key
          CLOUDINARY_CLOUD_NAME: placeholder

      - name: Collect the text each note will read aloud
        run: bun scripts/extract-tts.mjs
        env:
          TTS_HTML_DIR: .vercel/output/static # where the vercel preset writes prerendered pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-vieneu-v3-turbo-v1

      - run: pip install vieneu

      - name: Generate the missing audio
        run: python scripts/generate_tts.py
        env:
          TTS_MAX_NEW: "800"

      - name: Publish to gh-pages
        if: ${{ hashFiles('tts-out/**') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tts-out
          keep_files: true
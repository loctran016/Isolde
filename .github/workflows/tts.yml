name: Note audio (VieNeu TTS)

on:
  push:
    branches: [main]
    paths:
      - "content"
      - "scripts/tts-text.mjs"
      - "scripts/extract-tts.mjs"
      - "scripts/generate_tts.py"
      - ".github/workflows/tts.yml"
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-audio
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    env:
      HF_HOME: ${{ runner.temp }}/hf-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update content to the latest y
        run: git submodule update --init --remote content

      - name: Point Isolde at the new notes
        shell: bash
        run: |
          if ! git diff --quiet -- content; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "chore: update notes"

            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              echo "Rebase failed; resetting to remote branch state."
              git reset --hard "origin/${GITHUB_REF_NAME}"
            }

            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Does the audio branch exist?
        id: store
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.store.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: audio-store

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build
        env:
          NITRO_PRESET: vercel
          DEBUG: "true"
          NUXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NUXT_PUBLIC_SUPABASE_KEY: placeholder-key
          CLOUDINARY_CLOUD_NAME: placeholder

      - name: Collect the text each note will read aloud
        run: bun scripts/extract-tts.mjs
        env:
          TTS_HTML_DIR: .vercel/output/static

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/cache@v4
        id: hf-cache
        with:
          path: ${{ runner.temp }}/hf-cache
          key: hf-vieneu-v3-turbo-${{ runner.os }}-${{ hashFiles('scripts/generate_tts.py') }}
          restore-keys: |
            hf-vieneu-v3-turbo-${{ runner.os }}-
            hf-vieneu-v3-turbo-

      - name: Sanity-check Hugging Face cache
        shell: bash
        run: |
          mkdir -p "${HF_HOME}"

          if [ -d "${HF_HOME}/hub" ]; then
            if ! find "${HF_HOME}/hub" -maxdepth 3 -type f -name "*.data" 2>/dev/null | head -n 1 | grep -q .; then
              echo "HF cache appears empty or incomplete; clearing it."
              rm -rf "${HF_HOME}"
              mkdir -p "${HF_HOME}"
            fi
          fi

      - name: Install Vieneu
        run: pip install vieneu

      - name: Generate the missing audio
        run: python scripts/generate_tts.py
        env:
          TTS_MAX_NEW: "800"
          TTS_PRECISION: "fp32"

      - name: Publish to gh-pages
        if: ${{ hashFiles('tts-out/**') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tts-out
          keep_files: true
name: Note audio (VieNeu TTS)

on:
  push:
    branches: [main]
    paths:
      - 'content' # a submodule update shows up as a change to this one path
      - 'scripts/tts-text.mjs'
      - 'scripts/extract-tts.mjs'
      - 'scripts/generate_tts.py'
      - '.github/workflows/tts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-audio
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # content/ is the "y" repo
          # token: ${{ secrets.SUBMODULE_TOKEN }} # needed only if the "y" repo is private

      # Audio published by earlier runs. Skipped on the very first run, when the branch doesn't exist yet.
      - name: Does the audio branch exist?
        id: store
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.store.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: audio-store

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Prerenders every note into .output/public
      - run: bun run build
        env:
          NITRO_PRESET: node-server

      - name: Collect the text each note will read aloud
        run: bun scripts/extract-tts.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-vieneu-v3-turbo-v1

      - run: pip install vieneu

      - name: Generate the missing audio
        run: python scripts/generate_tts.py
        env:
          TTS_MAX_NEW: '800'

      - name: Publish to gh-pages
        if: ${{ hashFiles('tts-out/**') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tts-out
          keep_files: true
